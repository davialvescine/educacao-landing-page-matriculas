# Ambiente local idêntico ao de produção (Coolify): app + Postgres.
# Subir:  docker compose up -d --build
# Parar:  docker compose down            (com -v apaga também o banco)
# Site:   http://localhost:3300          Painel: /painel (senha abaixo)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: matriculas
      POSTGRES_PASSWORD: matriculas-local
      POSTGRES_DB: matriculas
    volumes:
      - dados-db:/var/lib/postgresql/data
      # Cria a tabela de leads na primeira subida.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"   # acesso do host (psql, CLI do Better Auth)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matriculas -d matriculas"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de e-mail de testes: nada sai para a internet.
  # Caixa de entrada em http://localhost:8025
  email:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      email:
        condition: service_started
    environment:
      DATABASE_URL: postgres://matriculas:matriculas-local@db:5432/matriculas
      BETTER_AUTH_SECRET: segredo-local-de-desenvolvimento-32-chars
      BETTER_AUTH_URL: http://localhost:3300
      SMTP_HOST: email
      SMTP_PORTA: "1025"
      SMTP_USUARIO: painel@educaadventistacentrooeste.com.br
      SMTP_SENHA: local
      SMTP_REMETENTE: "Educação Adventista Centro-Oeste <painel@educaadventistacentrooeste.com.br>"
      SEVENBEE_WEBHOOK_SEGREDO: teste-segredo-123
      CRON_SEGREDO: teste-cron-123
      # Para testar o envio real ao Sevenbee, descomente e cole o token:
      # SEVENBEE_TOKEN: pn_xxxxxxxxxxxxxxxxxxxxxx
    ports:
      - "3300:3000"

volumes:
  dados-db:

  # Só este serviço ganhou processo próprio, e por dois motivos: Route
  # Handler não segura WebSocket, e output "standalone" do Next não
  # convive com servidor customizado. Se ele cair, o painel continua de
  # pé — perde só a atualização automática.
  tempo-real:
    build: ./tempo-real
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://matriculas:matriculas-local@db:5432/matriculas
      ORIGEM: http://localhost:3300
      PORTA: "3801"
    ports:
      - "3801:3801"
